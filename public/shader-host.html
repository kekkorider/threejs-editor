<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Node Editor</title>
    <style>
      html, body, iframe { margin: 0; width: 100%; height: 100%; border: 0; background: #1b1b1b; }
    </style>
  </head>
  <body>
    <iframe id="frame" title="Node editor"></iframe>
    <script>
      const params = new URLSearchParams(location.search)
      const title = params.get('title')
      if (title) document.title = title
      const editorOrigin = 'https://www.tsl-graph.xyz'
      const frame = document.getElementById('frame')
      window.addEventListener('message', (event) => {
        if (event.source !== window.opener || event.origin !== location.origin) return
        if (!(frame instanceof HTMLIFrameElement)) return
        const data = event.data
        if (data && data.source === 'tsl-graph-host' && data.type === 'tsl-host:open' && typeof data.src === 'string' && data.src.startsWith(`${editorOrigin}/`)) {
          frame.src = data.src
          return
        }
        frame.contentWindow?.postMessage(data, editorOrigin)
      })
    </script>
  </body>
</html>
